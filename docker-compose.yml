services:
  teamspeak:
    image: ghcr.io/ithilias/ts3-server-arm64:latest
    # To build locally instead of pulling from GHCR, comment out `image:` above
    # and uncomment:
    # build: .
    container_name: teamspeak
    restart: unless-stopped
    init: true                # tini as PID 1: reaps zombies, clean signals
    stop_grace_period: 30s    # give SQLite time to flush before SIGKILL
    env_file:
      - path: .env
        required: false
    security_opt:
      - no-new-privileges:true   # safe: gosu drops privileges without setuid
    environment:
      TZ: ${TZ:-Europe/Berlin}   # set TZ in .env to override
      # TS3_QUERY_ADMIN_PASSWORD: change-me
    # Host and container ports follow the same .env variables the server uses,
    # so changing a port in .env moves both sides together.
    ports:
      - "${TS3_VOICE_PORT:-9987}:${TS3_VOICE_PORT:-9987}/udp"                        # voice
      - "${TS3_FILETRANSFER_PORT:-30033}:${TS3_FILETRANSFER_PORT:-30033}/tcp"        # file transfer
      # SSH ServerQuery, published on all interfaces. RESTRICT IT with a host
      # firewall to the sources that need it, and never publish the plaintext
      # raw query port (10011).
      - "${TS3_QUERY_SSH_PORT:-10022}:${TS3_QUERY_SSH_PORT:-10022}/tcp"
    volumes:
      - ts3-data:/data

volumes:
  ts3-data:
