name: build

on:
  push:
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC: rebuild for a fresh Debian base (off the top of the hour to avoid GitHub's high-load drops)
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# PR runs get a group per PR and cancel superseded pushes. Each tag push gets
# its own group, so two tags pushed close together are never dropped as a
# superseded pending run; scheduled and manual rebuilds share one group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.event_name == 'push' && format('publish-{0}', github.ref_name) || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SMOKE_IMAGE: ts3-server-arm64:smoke

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need tags for the release-tag checkout below

      # Scheduled and manual rebuilds must ship the last RELEASED version with a
      # fresh base (not whatever is on the default branch), so merging a PR
      # doesn't publish until it's tagged. Only final vX.Y.Z tags count; release
      # candidates (vX.Y.Z-rc1) are never picked up here.
      - name: On schedule / manual run, build the latest released tag
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [ -z "$tag" ]; then
            echo "No final vX.Y.Z tag yet; nothing to rebuild." >&2
            exit 1
          fi
          echo "Checking out $tag"
          git checkout -q "$tag"

      # Native arm64 runner, so box64 compiles natively (fast). QEMU is still
      # set up because the small x86_64-libstdc++ stage builds for linux/amd64.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build into the local Docker image store first and actually run it, so a
      # broken image (e.g. a new base or TS3 release box64 can't handle) never
      # reaches :latest. The scheduled run skips the layer cache so the weekly
      # rebuild really picks up fresh Debian packages.
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          pull: true # always re-resolve the base image
          no-cache: ${{ github.event_name == 'schedule' }}
          load: true
          tags: ${{ env.SMOKE_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (server starts and becomes healthy)
        run: |
          set -euo pipefail
          docker run -d --name ts3-smoke -e TS3_QUERY_ADMIN_PASSWORD=smoke-test "$SMOKE_IMAGE"
          # start-period is 90s and the first check runs after 30s; give box64 a
          # generous window before declaring the image broken.
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' ts3-smoke 2>/dev/null || echo gone)"
            running="$(docker inspect -f '{{.State.Running}}' ts3-smoke 2>/dev/null || echo false)"
            echo "health=$status running=$running"
            if [ "$status" = healthy ]; then break; fi
            if [ "$running" != true ]; then break; fi
            sleep 5
          done
          docker logs ts3-smoke 2>&1 | tail -n 50
          if [ "$status" != healthy ]; then
            echo "::error::Image did not become healthy (health=$status running=$running)"
            exit 1
          fi
          docker rm -f ts3-smoke >/dev/null

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag pushes use the event's own ref (with `git` context, a commit carrying
      # both v1.2.0-rc1 and v1.2.0 would resolve to the rc). Scheduled and manual
      # rebuilds use `git` so labels name the checked-out release, not master;
      # they must not republish the release's own :vX.Y.Z tag, which stays
      # immutable for rollbacks.
      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: ${{ github.event_name == 'push' && 'workflow' || 'git' }}
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag,enable=${{ github.event_name == 'push' }}
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value=latest,enable=${{ github.event_name != 'push' || !contains(github.ref_name, '-') }}

      # Same inputs as the smoke build, so this is served from the builder's
      # local cache: what gets pushed is what was tested.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
