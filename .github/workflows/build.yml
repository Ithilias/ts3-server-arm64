name: build

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC: rebuild for a fresh Debian base (off the top of the hour to avoid GitHub's high-load drops)
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need tags for the scheduled-build checkout below

      # The scheduled rebuild must ship the last RELEASED version with a fresh
      # base — not whatever is on the default branch — so merging an update PR
      # doesn't publish until it's tagged. Check out the latest v* tag.
      - name: On schedule, build the latest released tag
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$tag" ]; then
            echo "No v* tag yet; nothing to rebuild on schedule." >&2
            exit 1
          fi
          echo "Checking out $tag"
          git checkout -q "$tag"

      # Native arm64 runner, so box64 compiles natively (fast). QEMU is still
      # set up because the small x86_64-libstdc++ stage builds for linux/amd64.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          pull: true # always re-resolve the base image so weekly rebuilds get security updates
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
