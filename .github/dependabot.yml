version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current (it rewrites the
  # SHA and the "# vX.Y.Z" comment together). PRs run the build + smoke test.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
